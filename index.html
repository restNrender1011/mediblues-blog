<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Blog & Articles | Medi Blues</title>
<meta name="description" content="Health articles, medical tips and wellness guides from Medi Blues.">
<style>
:root{
  --mb-primary:#2563eb;--mb-primary-dark:#1d4ed8;--mb-teal:#0fae98;
  --mb-heading:#12233f;--mb-text:#334155;--mb-muted:#64748b;
  --mb-tint:#f3fafc;--mb-line:#dbe7ee;--mb-accent:#10b981;
  --mb-max:1180px;--mb-radius:8px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,"Segoe UI",sans-serif;line-height:1.6;color:var(--mb-text);background:#fff}
.mb-blog{min-height:100vh}
.mb-wrap{width:min(100% - 2rem,var(--mb-max));margin-inline:auto}
.mb-header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e6edf2}
.mb-header-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:2rem}
.mb-brand{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:var(--mb-heading)}
.mb-brand-mark{width:42px;height:42px;border-radius:5px;background:linear-gradient(135deg,var(--mb-primary),var(--mb-teal));display:grid;place-items:center;color:#fff;font-size:1rem;font-weight:800}
.mb-brand-name{font-size:1.18rem;font-weight:800;letter-spacing:.02em}
.mb-brand-tag{display:block;font-size:.55rem;letter-spacing:.16em;color:var(--mb-teal);font-weight:700;margin-top:-2px}
.mb-nav{display:flex;align-items:center;gap:1.7rem}
.mb-nav a{color:#172033;text-decoration:none;font-weight:600;font-size:.94rem}
.mb-nav a:hover{color:var(--mb-primary)}
.mb-appointment{background:var(--mb-primary);color:#fff!important;padding:.72rem 1.15rem;border-radius:4px;box-shadow:0 5px 14px rgba(37,99,235,.18)}
.mb-menu{display:none;border:0;background:none;font-size:1.5rem;color:var(--mb-heading)}
.mb-hero{background:linear-gradient(135deg,#f2fbff 0%,#fff 52%,#eefbf8 100%);border-bottom:1px solid var(--mb-line);padding:clamp(3.5rem,7vw,6.5rem) 0}
.mb-hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:4rem;align-items:center}
.mb-eyebrow{display:inline-block;color:var(--mb-primary);font-weight:800;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:1rem}
.mb-hero h1{margin:0 0 1rem;font-size:clamp(2.4rem,5vw,4.2rem);line-height:1.08;color:var(--mb-heading);letter-spacing:-.035em;max-width:14ch}
.mb-hero p{margin:0;max-width:58ch;color:#526277;font-size:1.08rem}
.mb-search-panel{background:#fff;border:1px solid var(--mb-line);padding:1.35rem;box-shadow:0 16px 40px rgba(24,65,90,.09)}
.mb-search-title{font-size:1rem;font-weight:800;color:var(--mb-heading);margin-bottom:.7rem}
.mb-search-box{display:flex;align-items:center;border:1px solid #cbd8e1;min-height:50px;padding:0 .9rem;color:#7a8998}
.mb-search-icon{font-size:1.15rem;margin-right:.6rem}
.mb-search-text{font-size:.94rem}
.mb-search-links{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.9rem}
.mb-search-links span{font-size:.78rem;color:var(--mb-primary);background:#eef5ff;padding:.35rem .55rem}
.mb-content{padding:4rem 0 5rem}
.mb-section-head{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}
.mb-section-kicker{color:var(--mb-teal);font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em}
.mb-section-title{margin:.2rem 0 0;color:var(--mb-heading);font-size:1.8rem;line-height:1.2}
.mb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
.mb-card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid #e1e9ee;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.mb-card:hover,.mb-card:focus-within{transform:translateY(-3px);border-color:#b9d3e5;box-shadow:0 12px 30px rgba(24,65,90,.10)}
.mb-media{aspect-ratio:16/9;background:#eef7fa;overflow:hidden}
.mb-media img{width:100%;height:100%;object-fit:cover;display:block}
.mb-ph{width:100%;height:100%;background:linear-gradient(135deg,var(--mb-primary),var(--mb-teal))}
.mb-body{display:flex;flex-direction:column;gap:.65rem;padding:1.35rem 1.35rem 1.5rem;flex:1}
.mb-meta{display:flex;flex-wrap:wrap;align-items:center;gap:.65rem;font-size:.78rem;color:var(--mb-muted)}
.mb-tag{font-weight:800;color:#087b70;background:#e6f8f5;padding:.25rem .55rem}
.mb-card h2{margin:0;font-size:1.18rem;line-height:1.35;color:var(--mb-heading)}
.mb-card p{margin:0;color:#5c6b7c;font-size:.94rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mb-read{margin-top:auto;padding-top:.65rem;font-weight:800;color:var(--mb-primary);text-decoration:none}
.mb-read::after{content:"";position:absolute;inset:0}
.mb-read:hover{text-decoration:underline}
.mb-more{text-align:center;margin-top:2.5rem}
.mb-btn{display:inline-block;padding:.72rem 1.45rem;border:1px solid var(--mb-primary);border-radius:3px;background:#fff;color:var(--mb-primary);font:inherit;font-weight:700;cursor:pointer}
.mb-btn:hover{background:var(--mb-primary);color:#fff}
.mb-status{text-align:center;color:var(--mb-muted);padding:3rem 0}
.mb-trust{background:#f5fafb;border-top:1px solid var(--mb-line);border-bottom:1px solid var(--mb-line);padding:2.5rem 0}
.mb-trust-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
.mb-trust-item{padding-right:2rem;border-right:1px solid var(--mb-line)}
.mb-trust-item:last-child{border-right:0}
.mb-trust-item strong{display:block;color:var(--mb-heading);font-size:1rem;margin-bottom:.3rem}
.mb-trust-item span{font-size:.9rem;color:var(--mb-muted)}
.mb-footer{background:#10263d;color:#dce8f1;padding:3rem 0 1.3rem}
.mb-footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:3rem}
.mb-footer h3{color:#fff;font-size:1rem;margin:0 0 .8rem}
.mb-footer p,.mb-footer a{font-size:.88rem;color:#b8c9d6;text-decoration:none}
.mb-footer a{display:block;margin:.35rem 0}
.mb-footer-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:2rem;padding-top:1rem;text-align:center;font-size:.78rem;color:#9eb2c1}
.mb-skel{height:330px;background:linear-gradient(90deg,#f1f7fa,#fff,#f1f7fa);background-size:200% 100%;animation:mb-shimmer 1.4s infinite linear}
@keyframes mb-shimmer{to{background-position:-200% 0}}
@media(max-width:900px){.mb-nav{gap:.8rem}.mb-hero-grid{grid-template-columns:1fr}.mb-grid{grid-template-columns:repeat(2,1fr)}.mb-trust-grid{grid-template-columns:1fr}.mb-trust-item{border-right:0;border-bottom:1px solid var(--mb-line);padding:0 0 1rem}.mb-trust-item:last-child{border-bottom:0}.mb-footer-grid{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.mb-header-inner{min-height:66px}.mb-nav{display:none}.mb-menu{display:block}.mb-grid{grid-template-columns:1fr}.mb-footer-grid{grid-template-columns:1fr}.mb-hero{padding:3rem 0}.mb-content{padding:3rem 0}.mb-section-head{display:block}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.mb-card{transition:none}.mb-skel{animation:none}}
</style>
</head>
<body>

<!-- Site header goes here if you include one -->

<main class="mb-blog">
  <section class="mb-hero">
    <div class="mb-wrap">
      <h1>Health articles and guides</h1>
      <p>Practical advice, symptom explainers and wellness tips from the Medi Blues team.</p>
    </div>
  </section>

  <section class="mb-list" aria-label="Articles">
    <div class="mb-wrap">
      <div class="mb-grid" id="mb-grid" aria-live="polite"></div>
      <p class="mb-status" id="mb-status" hidden></p>
      <div class="mb-more" id="mb-more" hidden>
        <button class="mb-btn" id="mb-more-btn" type="button">Load more articles</button>
      </div>
    </div>
  </section>
</main>

<!-- Site footer goes here if you include one -->

<script>
(() => {
  /* ---------- Config ---------- */
  const DATA_URL    = "posts.json";            // edited from /admin/ - do not edit by hand
  const ARTICLE_URL = "article.html?post=";    // page that shows one article (not built yet)
  const PAGE_SIZE   = 9;

  const grid = document.getElementById("mb-grid");
  const status = document.getElementById("mb-status");
  const more = document.getElementById("mb-more");
  const moreBtn = document.getElementById("mb-more-btn");
  let posts = [], shown = 0;

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slugify = s => String(s).toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-").replace(/-+/g, "-");
  const fmtDate = v => { const d = new Date(v); return isNaN(d) ? "" : d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }); };

  const card = p => `
    <article class="mb-card">
      <div class="mb-media">${p.image
        ? `<img src="${esc(p.image)}" alt="${esc(p.image_alt || "")}" loading="lazy">`
        : `<div class="mb-ph" aria-hidden="true"></div>`}</div>
      <div class="mb-body">
        <div class="mb-meta">
          <span class="mb-tag">${esc(p.category)}</span>
          <time datetime="${esc(p.date)}">${fmtDate(p.date)}</time>
        </div>
        <h2>${esc(p.title)}</h2>
        <p>${esc(p.excerpt)}</p>
        <a class="mb-read" href="${ARTICLE_URL}${encodeURIComponent(slugify(p.title))}" aria-label="Read article: ${esc(p.title)}">Read article</a>
      </div>
    </article>`;

  function render() {
    const next = posts.slice(shown, shown + PAGE_SIZE);
    grid.insertAdjacentHTML("beforeend", next.map(card).join(""));
    shown += next.length;
    more.hidden = shown >= posts.length;
  }

  async function init() {
    grid.innerHTML = '<div class="mb-skel"></div>'.repeat(6);
    try {
      const res = await fetch(DATA_URL, { cache: "no-cache" });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      const now = Date.now();
      posts = (data.posts || [])
        .filter(p => p.published !== false && (!p.date || new Date(p.date) <= now))
        .sort((a, b) => new Date(b.date) - new Date(a.date));
      grid.innerHTML = "";
      if (!posts.length) { status.textContent = "No articles yet. Please check back soon."; status.hidden = false; return; }
      render();
    } catch (e) {
      grid.innerHTML = "";
      status.textContent = "We couldn't load the articles right now. Please refresh the page or try again shortly.";
      status.hidden = false;
    }
  }

  moreBtn.addEventListener("click", render);
  init();
})();
</script>
</body>
</html>
