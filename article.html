<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Medi Blues | Health Article</title>
  <meta name="description" content="Health information and medical guidance from Medi Blues.">

  <style>
    :root {
      --primary: #1b5fc1;
      --primary-dark: #134a9c;
      --heading: #0b2545;
      --text: #23364d;
      --muted: #5d7089;
      --tint: #eaf2fc;
      --line: #d5e2f3;
      --accent: #0f9d8a;
      --max: 900px;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, "Segoe UI", sans-serif;
      line-height: 1.7;
      color: var(--text);
      background: #fff;
    }

    .wrap {
      width: min(100% - 2.5rem, var(--max));
      margin-inline: auto;
    }

    .hero {
      background: var(--tint);
      border-bottom: 1px solid var(--line);
      padding: 3rem 0;
    }

    .back {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .back:hover {
      text-decoration: underline;
    }

    .category {
      display: inline-block;
      padding: .3rem .8rem;
      border-radius: 999px;
      background: #fff;
      color: var(--primary-dark);
      font-weight: 600;
      font-size: .9rem;
    }

    h1 {
      margin: 1rem 0 .75rem;
      color: var(--heading);
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.15;
      letter-spacing: -.02em;
    }

    .date {
      color: var(--muted);
      font-size: .95rem;
    }

    .article {
      padding: 3rem 0 5rem;
    }

    .article-image {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: var(--radius);
      margin-bottom: 2rem;
    }

    .placeholder {
      height: 320px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      margin-bottom: 2rem;
    }

    .content {
      font-size: 1.08rem;
    }

    .content p {
      margin: 0 0 1.3rem;
    }

    .content h2,
    .content h3 {
      color: var(--heading);
      line-height: 1.3;
      margin-top: 2rem;
    }

    .status {
      text-align: center;
      color: var(--muted);
      padding: 4rem 0;
    }

    .error {
      color: #a33;
    }

    @media (max-width: 600px) {
      .wrap {
        width: min(100% - 1.5rem, var(--max));
      }

      .hero {
        padding: 2rem 0;
      }

      .article {
        padding-top: 2rem;
      }
    }
  </style>
</head>

<body>

  <header class="hero">
    <div class="wrap">
      <a class="back" href="./">← Back to Medi Blues Blog</a>

      <div id="category" class="category" hidden></div>

      <h1 id="title">Loading article...</h1>

      <div id="date" class="date"></div>
    </div>
  </header>

  <main class="article">
    <div class="wrap">

      <div id="status" class="status">
        Loading article...
      </div>

      <article id="article-content" hidden>

        <img
          id="article-image"
          class="article-image"
          alt=""
          hidden
        >

        <div
          id="article-placeholder"
          class="placeholder"
          aria-hidden="true"
          hidden>
        </div>

        <div id="content" class="content"></div>

      </article>

    </div>
  </main>

<script>
(() => {

  const DATA_URL = "posts.json";

  const params = new URLSearchParams(window.location.search);
  const requestedPost = params.get("post");

  const titleEl = document.getElementById("title");
  const categoryEl = document.getElementById("category");
  const dateEl = document.getElementById("date");
  const statusEl = document.getElementById("status");
  const articleEl = document.getElementById("article-content");
  const imageEl = document.getElementById("article-image");
  const placeholderEl = document.getElementById("article-placeholder");
  const contentEl = document.getElementById("content");

  const slugify = value =>
    String(value || "")
      .toLowerCase()
      .normalize("NFKD")
      .replace(/[^\w\s-]/g, "")
      .trim()
      .replace(/[\s_]+/g, "-")
      .replace(/-+/g, "-");

  const formatDate = value => {
    const date = new Date(value);

    if (isNaN(date)) return "";

    return date.toLocaleDateString("en-IN", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });
  };

  const escapeHTML = value =>
    String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char]));

  async function loadArticle() {

    if (!requestedPost) {
      showError("No article was specified.");
      return;
    }

    try {

      const response = await fetch(DATA_URL, {
        cache: "no-cache"
      });

      if (!response.ok) {
        throw new Error("Unable to load posts.");
      }

      const data = await response.json();

      const posts = Array.isArray(data.posts)
        ? data.posts
        : [];

      const post = posts.find(item =>
        item.published !== false &&
        slugify(item.title) === requestedPost
      );

      if (!post) {
        showError("Article not found.");
        return;
      }

      document.title = `${post.title} | Medi Blues`;

      titleEl.textContent = post.title;

      if (post.category) {
        categoryEl.textContent = post.category;
        categoryEl.hidden = false;
      }

      dateEl.textContent = formatDate(post.date);

      if (post.image) {

        imageEl.src = post.image;
        imageEl.alt = post.image_alt || post.title;
        imageEl.hidden = false;

      } else {

        placeholderEl.hidden = false;

      }

      /*
       * For now, the body is treated as plain text.
       * This prevents HTML from being injected accidentally.
       */
      const paragraphs = String(post.body || "")
        .split(/\n\s*\n/)
        .map(text => text.trim())
        .filter(Boolean);

      contentEl.innerHTML = paragraphs
        .map(paragraph => `<p>${escapeHTML(paragraph)}</p>`)
        .join("");

      statusEl.hidden = true;
      articleEl.hidden = false;

    } catch (error) {

      console.error(error);

      showError(
        "We couldn't load this article right now. Please try again."
      );

    }
  }

  function showError(message) {

    statusEl.textContent = message;
    statusEl.classList.add("error");
    statusEl.hidden = false;

    articleEl.hidden = true;
  }

  loadArticle();

})();
</script>

</body>
</html>
