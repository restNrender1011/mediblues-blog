<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Medi Blues | Health Article</title>
  <meta name="description" content="Health information and medical guidance from Medi Blues.">

  <style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--teal:#0fae98;--heading:#12233f;--text:#334155;--muted:#64748b;--tint:#f3fafc;--line:#dbe7ee;--max:960px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:Arial,"Segoe UI",sans-serif;line-height:1.75;color:var(--text);background:#fff}
.wrap{width:min(100% - 2rem,var(--max));margin-inline:auto}
.site-header{background:#fff;border-bottom:1px solid #e6edf2}
.header-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:2rem}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--heading)}
.brand-mark{width:40px;height:40px;border-radius:5px;background:linear-gradient(135deg,var(--primary),var(--teal));display:grid;place-items:center;color:#fff;font-weight:800}
.brand-name{font-size:1.12rem;font-weight:800}
.brand-tag{display:block;font-size:.5rem;letter-spacing:.14em;color:var(--teal);font-weight:700}
.nav{display:flex;align-items:center;gap:1.4rem}.nav a{color:#172033;text-decoration:none;font-weight:600;font-size:.9rem}.nav a:hover{color:var(--primary)}
.appointment{background:var(--primary);color:#fff!important;padding:.68rem 1rem;border-radius:4px}
.hero{background:linear-gradient(135deg,#f2fbff 0%,#fff 52%,#eefbf8 100%);border-bottom:1px solid var(--line);padding:3.5rem 0 4rem}
.back{display:inline-block;margin-bottom:2rem;color:var(--primary);text-decoration:none;font-weight:700;font-size:.9rem}
.back:hover{text-decoration:underline}
.category{display:inline-block;padding:.28rem .65rem;background:#e6f8f5;color:#087b70;font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
h1{margin:1rem 0 .8rem;color:var(--heading);font-size:clamp(2.2rem,5vw,4rem);line-height:1.1;letter-spacing:-.035em;max-width:18ch}
.date{color:var(--muted);font-size:.9rem}
.article{padding:3rem 0 5rem}.article-inner{max-width:850px}
.article-image{width:100%;max-height:520px;object-fit:cover;margin:0 0 2.5rem;border-radius:4px}
.placeholder{height:360px;background:linear-gradient(135deg,var(--primary),var(--teal));margin-bottom:2.5rem;border-radius:4px}
.content{font-size:1.08rem;max-width:760px}
.content p{margin:0 0 1.35rem}
.content h2,.content h3{color:var(--heading);line-height:1.3;margin:2.4rem 0 1rem}
.content h2{font-size:1.65rem}.content h3{font-size:1.25rem}
.status{text-align:center;color:var(--muted);padding:4rem 0}.error{color:#a33}
.article-note{margin-top:3rem;padding:1.25rem 1.4rem;border-left:4px solid var(--teal);background:#f5fafb;color:#536476;font-size:.9rem}
.footer{background:#10263d;color:#dce8f1;padding:2.8rem 0 1.2rem}.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:2.5rem}.footer h3{color:#fff;font-size:1rem;margin:0 0 .7rem}.footer p,.footer a{font-size:.86rem;color:#b8c9d6;text-decoration:none}.footer a{display:block;margin:.3rem 0}.footer-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:1.8rem;padding-top:1rem;text-align:center;font-size:.76rem;color:#9eb2c1}
@media(max-width:800px){.nav{gap:.6rem}.nav a:not(.appointment){display:none}.footer-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.header-inner{min-height:66px}.hero{padding:2.5rem 0 3rem}.article{padding:2rem 0 3.5rem}.footer-grid{grid-template-columns:1fr}}
</style>
</head>

<body>

  <header class="hero">
    <div class="wrap">
      <a class="back" href="./">← Back to Medi Blues Blog</a>

      <div id="category" class="category" hidden></div>

      <h1 id="title">Loading article...</h1>

      <div id="date" class="date"></div>
    </div>
  </header>

  <main class="article">
    <div class="wrap">

      <div id="status" class="status">
        Loading article...
      </div>

      <article id="article-content" hidden>

        <img
          id="article-image"
          class="article-image"
          alt=""
          hidden
        >

        <div
          id="article-placeholder"
          class="placeholder"
          aria-hidden="true"
          hidden>
        </div>

        <div id="content" class="content"></div>

      </article>

    </div>
  </main>

<script>
(() => {

  const DATA_URL = "posts.json";

  const params = new URLSearchParams(window.location.search);
  const requestedPost = params.get("post");

  const titleEl = document.getElementById("title");
  const categoryEl = document.getElementById("category");
  const dateEl = document.getElementById("date");
  const statusEl = document.getElementById("status");
  const articleEl = document.getElementById("article-content");
  const imageEl = document.getElementById("article-image");
  const placeholderEl = document.getElementById("article-placeholder");
  const contentEl = document.getElementById("content");

  const slugify = value =>
    String(value || "")
      .toLowerCase()
      .normalize("NFKD")
      .replace(/[^\w\s-]/g, "")
      .trim()
      .replace(/[\s_]+/g, "-")
      .replace(/-+/g, "-");

  const formatDate = value => {
    const date = new Date(value);

    if (isNaN(date)) return "";

    return date.toLocaleDateString("en-IN", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });
  };

  const escapeHTML = value =>
    String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char]));

  async function loadArticle() {

    if (!requestedPost) {
      showError("No article was specified.");
      return;
    }

    try {

      const response = await fetch(DATA_URL, {
        cache: "no-cache"
      });

      if (!response.ok) {
        throw new Error("Unable to load posts.");
      }

      const data = await response.json();

      const posts = Array.isArray(data.posts)
        ? data.posts
        : [];

      const post = posts.find(item =>
        item.published !== false &&
        slugify(item.title) === requestedPost
      );

      if (!post) {
        showError("Article not found.");
        return;
      }

      document.title = `${post.title} | Medi Blues`;

      titleEl.textContent = post.title;

      if (post.category) {
        categoryEl.textContent = post.category;
        categoryEl.hidden = false;
      }

      dateEl.textContent = formatDate(post.date);

      if (post.image) {

        imageEl.src = post.image;
        imageEl.alt = post.image_alt || post.title;
        imageEl.hidden = false;

      } else {

        placeholderEl.hidden = false;

      }

      /*
       * For now, the body is treated as plain text.
       * This prevents HTML from being injected accidentally.
       */
      const paragraphs = String(post.body || "")
        .split(/\n\s*\n/)
        .map(text => text.trim())
        .filter(Boolean);

      contentEl.innerHTML = paragraphs
        .map(paragraph => `<p>${escapeHTML(paragraph)}</p>`)
        .join("");

      statusEl.hidden = true;
      articleEl.hidden = false;

    } catch (error) {

      console.error(error);

      showError(
        "We couldn't load this article right now. Please try again."
      );

    }
  }

  function showError(message) {

    statusEl.textContent = message;
    statusEl.classList.add("error");
    statusEl.hidden = false;

    articleEl.hidden = true;
  }

  loadArticle();

})();
</script>

</body>
</html>
